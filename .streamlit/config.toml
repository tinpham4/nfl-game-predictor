# Theme for the deployed app. Without this, Streamlit Cloud picks its own
# default red, which fights the blue I use in the charts.

[theme]
primaryColor = "#1F6FD0"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F3F7"
textColor = "#14181F"

[server]
headless = true

[browser]
gatherUsageStats = false
